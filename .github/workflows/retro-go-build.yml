
name: Retro-Go ESP32-S3 Firmware Build

on:
  workflow_dispatch:

jobs:
  build-firmware:
    runs-on: ubuntu-22.04
    timeout-minutes: 60

    steps:
      - name: Checkout Retro-Go
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git wget flex bison gperf \
            python3 python3-pip python3-venv \
            cmake ninja-build ccache \
            libffi-dev libssl-dev \
            libusb-1.0-0 dfu-util

      - name: Download ESP-IDF 4.4.8
        run: |
          git clone --depth 1 \
            --branch v4.4.8 \
            --recurse-submodules \
            --shallow-submodules \
            https://github.com/espressif/esp-idf.git \
            "$HOME/esp-idf"

      - name: Install ESP32-S3 toolchain
        run: |
          "$HOME/esp-idf/install.sh" esp32s3

      - name: Build Retro-Go launcher and bootloader
        shell: bash
        run: |
          source "$HOME/esp-idf/export.sh"

          idf.py --version

          echo "Building ESP32-S3 Retro-Go launcher..."

          python3 rg_tool.py build launcher \
            --target esp32-s3-devkit

          echo "Building ESP32-S3 bootloader..."

          (
            cd launcher
            idf.py bootloader
          )

          echo "ESP32-S3 launcher and bootloader completed!"

      - name: Verify firmware files
        shell: bash
        run: |
          echo "Checking generated firmware files..."

          test -f launcher/build/launcher.bin
          test -f launcher/build/bootloader/bootloader.bin
          test -f launcher/build/partition_table/partition-table.bin

          echo "Generated firmware files:"
          find launcher/build \
            -type f \
            \( -name "*.bin" -o -name "flasher_args.json" \) \
            -print

          echo "Firmware files verified!"

      - name: Upload ESP32-S3 firmware
        uses: actions/upload-artifact@v4
        with:
          name: retro-go-esp32s3-launcher
          path: |
            launcher/build/*.bin
            launcher/build/bootloader/*.bin
            launcher/build/partition_table/*.bin
            launcher/build/flasher_args.json
          if-no-files-found: error
          retention-days: 30
